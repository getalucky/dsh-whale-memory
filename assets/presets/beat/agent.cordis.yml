# The `beat` agent preset: the search-only composition the proactive agent runs on.
#
# An agent that joins NO preset resolves its tools, prompt sections, and skill
# catalog against the EMPTY GLOBAL LAYER. This preset gives the wander agent
# exactly one model-facing tool (`web_search`) plus compaction; it has no shell,
# no filesystem, no delegation, and no persona row (the deployment persona is
# injected globally by this plugin).
#
# If this file is missing, the wander agent is a bare agent and cannot even see
# `web_search`; beat stays off instead of burning tokens on a search-less turn.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
