  <text x="62" y="464" class="k2">trust.js 信任门</text>
  <text x="62" y="486" class="d">external 库默认不注入 / 不整理</text>
  <text x="62" y="504" class="d">内容指纹漂移 → 自动撤销信任</text>

  <rect x="48" y="530" width="314" height="80" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.1"/>
  <text x="62" y="554" class="k2">visibility.js 可见性</text>
