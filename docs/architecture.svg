  <text x="418" y="374" class="k2">ingest.js</text>
  <text x="418" y="394" class="d">采集 user / assistant</text>
  <text x="418" y="411" class="d">过滤元消息 · 拆发言人</text>
  <text x="418" y="428" class="d">凭据打码 · 来源判定</text>

  <rect x="594" y="350" width="150" height="88" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="608" y="374" class="k2">staging/*.jsonl</text>
