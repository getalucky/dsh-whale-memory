  <rect x="382" y="326" width="666" height="440" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#fde68a"/>
  <text x="398" y="340" font-size="11.5" font-weight="700" fill="#b45309">写入 / 整理</text>

