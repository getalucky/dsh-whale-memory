  <text x="608" y="428" class="d">孤儿 → orphan 隔离</text>

  <rect x="764" y="350" width="262" height="88" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="778" y="374" class="k2">distill.js 蒸馏</text>
  <text x="778" y="394" class="d">会话空闲 10min 触发</text>
  <text x="778" y="411" class="d">规则抽取 + 可选 LLM 抽取</text>
  <text x="778" y="428" class="d">相对时间按发言时刻锚定</text>

  <rect x="404" y="450" width="170" height="88" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="418" y="474" class="k2">inbound.js 外部入库</text>
  <text x="418" y="494" class="d">每 5min 拉取</text>
  <text x="418" y="511" class="d">字节水位 + 正文 hash</text>
  <text x="418" y="528" class="d">半行等待 · 幂等去重</text>

  <rect x="594" y="450" width="432" height="88" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="608" y="474" class="k2">store.js + vault.js 持久层</text>
  <text x="608" y="494" class="d">进程内串行写锁 · 临时文件 + rename 原子写</text>
  <text x="608" y="511" class="d">先写主库，再写副库；副库坏了可从主库重建</text>
  <text x="608" y="528" class="d">容量门 400 · 事实取代 · 删除只归档</text>

  <rect x="404" y="550" width="622" height="76" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="418" y="574" class="k2">整理动作</text>
  <text x="418" y="596" class="d">事实取代（superseded） · 容量门 · 深化合并近重复</text>
  <text x="418" y="614" class="d">图谱抽三元组（规则 → LLM） · 画像 / 群成员派生</text>

  <rect x="404" y="640" width="302" height="70" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="418" y="664" class="k2">确认闸门 gate.js</text>
  <text x="418" y="686" class="d">enforce / warn / off 三态灰度</text>
  <text x="418" y="702" class="d">suggested 不进副库、不参与检索</text>

  <rect x="722" y="640" width="304" height="70" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="736" y="664" class="k2">审计 audit</text>
  <text x="736" y="686" class="d">writes / reads / injects.jsonl</text>
  <text x="736" y="702" class="d">真实账本算读有效率 / 写准确率</text>

  <text x="398" y="744" font-size="10.5" fill="#92400e">跨进程写库要求 DSH 关闭；同一进程内所有写入共用一把锁</text>

