  <text x="1088" y="654" class="d">memory_save（带原话）· confirm · correct · update · forget</text>
  <text x="1088" y="670" class="d">revive · pin · experience；写作用分片超 10min 拒绝</text>

  <rect x="1074" y="686" width="592" height="70" rx="10" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.1"/>
