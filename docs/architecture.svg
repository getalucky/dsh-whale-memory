  <text x="1088" y="482" class="d">search_memory · read_memory · profile_show</text>
  <text x="1088" y="500" class="d">memory_experience(show) · 先搜后读，正文不常驻</text>

  <rect x="1074" y="522" width="592" height="76" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.1"/>
  <text x="1088" y="546" class="k2">检索漏斗 funnel.js + recall.js</text>
  <text x="1088" y="568" class="d">字符 n-gram TF-IDF（离线） · 可选向量 · 标签一跳展开</text>
  <text x="1088" y="586" class="d">语义 / 标签 / 权重 / 新近 / 置信加权；按可见性取分片</text>

