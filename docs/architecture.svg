  <text x="1088" y="414" class="d">+ AGENT.md / USER.md 摘要 + 压缩恢复包；预算受限</text>

  <rect x="1074" y="436" width="592" height="76" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.1"/>
